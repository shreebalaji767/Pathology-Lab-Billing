<style>

width:570px}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf1f3}th{font-size:11px;text-transform:uppercase;color:#71818a;background:#f8fafb}td{font-size:13px}.pill{border-radius:20px;padding:3px 8px;background:#e8f5ee;color:#16804a;font-size:11px;font-weight:700}.due{background:#fff1e8;color:#a34c12}.empty{text-align:center;padding:25px;color:var(--muted)}.notice{padding:10px;background:#edf7f8;border-radius:8px;margin:12px 0;color:#245c66}.modal{position:fixed;inset:0;background:#0c202b80;display:grid;place-items:center;padding:14px;z-index:5}.modal.hidden{display:none}.modalbox{background:white;border-radius:13px;padding:18px;width:min(760px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalhead h3{margin:0}.lines{display:grid;gap:7px}.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px auto;gap:6px}.line input,.line select{width:100%;min-width:0;padding:8px;border:1px solid #ccd9df;border-radius:7px}.invoice{background:#fff;padding:20px;color:#172b36}.labtitle{text-align:center;font-size:21px;font-weight:800}.sub{text-align:center;color:#667985;font-size:12px}.invoice table{min-width:0}.right{text-align:right}.totals{width:min(300px,100%);margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:4px}.grand{font-size:18px;font-weight:800;border-top:1px solid;padding-top:8px!important}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;min-width:max-content}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){main{padding:13px}.head{display:block}.head .actions{margin-top:10px}.form,.settings{grid-template-columns:1fr}.top{padding:12px}.top h1{font-size:15px}.line{grid-template-columns:minmax(0,1fr) 85px 48px 32px}.line-head{font-size:9px}.invoice{padding:10px}}@media print{.top,aside,.head,.no-print{display:none!important}.layout{display:block}main{padding:0}.invoice{padding:0}@page{margin:10mm}}
</style></head><body>
<header class="top"><div><h1 id="brand">YOUR PATHOLOGY LAB</h1><small id="brandSubtitle">Local laboratory billing & management</small></div><div class="actions"><button class="alt" onclick="go('settings')">Settings</button><button class="alt" onclick="newBill()">＋ New invoice</button></div></header>
<div class="layout"><aside><nav class="nav" id="nav"><button class="active" data-p="dashboard">Dashboard</button><button data-p="invoices">Invoices</button><button data-p="patients">Patients</button><button data-p="tests">Test catalogue</button><button data-p="packages">Test packages</button><button data-p="doctors">Doctors</button><button data-p="reports">Collection reports</button><button data-p="settings">Settings & backup</button></nav></aside><main id="main"></main></div>
<div class="modal hidden" id="modal"><div class="modalbox"><div class="modalhead"><h3 id="mtitle"></h3><button class="alt" onclick="closeM()">Close</button></div><div id="mbody"></div></div></div>
<script>
const KEY='pathologyLabBilling_v1',blank={profile:{name:'YOUR PATHOLOGY LAB',subtitle:'DIAGNOSTIC & CLINICAL LABORATORY',address:'',phone:'',whatsapp:'',email:'',registration:'',footer:'Thank you for choosing our laboratory.',signatory:'Authorized Signatory',invoiceTitle:'PATIENT INVOICE',prefix:'INV',next:1,currency:'₹'},tests:[],packages:[],patients:[],doctors:[],invoices:[]};
let db=read(),page='dashboard',lines=[];function applyBrand(){let p=db.profile;document.getElementById('brand').textContent=p.brandTitle||'YOUR PATHOLOGY LAB';document.getElementById('brandSubtitle').textContent=p.brandSubtitle||'Local laboratory billing & management'}applyBrand();
function read(){try{return Object.assign(structuredClone(blank),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{return structuredClone(blank)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cash(n){return (db.profile.currency||'₹')+Number(n||0).toFixed(2)}function today(){return new Date().toISOString().slice(0,10)}function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));render()}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
function head(t,d,act=''){return '<div class="head"><div><h2>'+t+'</h2><p class="muted">'+d+'</p></div><div class="actions">'+act+'</div></div>'}
function render(){document.getElementById('brand').textContent=db.profile.name||'Pathology Lab Billing';({dashboard:dash,invoices:invoicePage,patients:patientPage,tests:testPage,packages:packagePage,doctors:doctorPage,reports:reportPage,settings:settingsPage})[page]()}
function tableBills(a){if(!a.length)return '<div class="empty">No records found.</div>';return '<div class="tablewrap"><table><tr><th>Invoice</th><th>Date</th><th>Patient</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr>'+a.map(x=>'<tr><td>'+esc(x.no)+'</td><td>'+esc(x.date)+'</td><td>'+esc(x.patient)+'</td><td>'+cash(x.total)+'</td><td>'+cash(x.paid)+'</td><td>'+cash(x.due)+'</td><td><span class="pill '+(x.status==='cancelled'?'cancelled':x.due?'due':'')+'">'+(x.status==='cancelled'?'Cancelled':x.due?'Pending':'Paid')+'</span></td><td><button class="alt" onclick="viewBill(\''+x.id+'\')">Open</button></td></tr>').join('')+'</table></div>'}
function dash(){let a=db.invoices.filter(x=>x.date===today()),sum=k=>a.reduce((s,x)=>s+x[k],0);main.innerHTML=head('Dashboard','Laboratory billing overview','<button onclick="newBill()">＋ Create invoice</button>')+'<div class="stats"><div class="stat"><small>Today invoices</small><strong>'+a.length+'</strong></div><div class="stat"><small>Today billed</small><strong>'+cash(sum('total'))+'</strong></div><div class="stat"><small>Today collected</small><strong>'+cash(sum('paid'))+'</strong></div><div class="stat"><small>Pending overall</small><strong>'+cash(db.invoices.reduce((s,x)=>s+x.due,0))+'</strong></div></div><section class="panel"><h3>Recent invoices</h3>'+tableBills(db.invoices.slice().reverse().slice(0,7))+'</section><div class="notice">Data stays in this browser only. Export backups regularly; browser data can be erased or unavailable on another device.</div>'}
function invoicePage(){main.innerHTML=head('Invoices','Search, edit, print and track payments','<button onclick="newBill()">＋ New invoice</button>')+'<section class="panel"><div class="toolbar"><input id="q" placeholder="Search patient or invoice" oninput="filterBills()"><select id="status" onchange="filterBills()"><option value="">All</option><option value="due">Pending</option><option value="paid">Paid</option></select></div><div id="billlist">'+tableBills(db.invoices.slice().reverse())+'</div></section>'}function filterBills(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;document.getElementById('billlist').innerHTML=tableBills(db.invoices.slice().reverse().filter(x=>(x.no+x.patient+x.phone).toLowerCase().includes(q)&&(!s||(s==='due'?x.due>0:x.due===0))))}
function patientPage(){main.innerHTML=head('Patients','Patient directory and previous invoices','<button onclick="editPatient()">＋ Add patient</button>')+'<section class="panel">'+(db.patients.length?'<div class="tablewrap"><table><tr><th>Name</th><th>Age / Gender</th><th>Phone</th><th>History</th><th></th></tr>'+db.patients.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+esc(p.age)+' / '+esc(p.gender)+'</td><td>'+esc(p.phone)+'</td><td>'+db.invoices.filter(i=>i.patientId===p.id).length+'</td><td><button class="alt" onclick="history(\''+p.id+'\')">History</button> <button class="alt" onclick="editPatient(\''+p.id+'\')">Edit</button></td></tr>').join('')+'</table></div>':'<div class="empty">No patients yet. Patients are also added during billing.</div>')+'</section>'}
function testTable(a){return a.length?'<div class="tablewrap"><table><tr><th>Test</th><th>Category</th><th>Price</th><th></th></tr>'+a.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.category)+'</td><td>'+cash(t.price)+'</td><td><button class="alt" onclick="editTest(\''+t.id+'\')">Edit</button> <button class="danger" onclick="del(\'tests\',\''+t.id+'\')">Delete</button></td></tr>').join('')+'</table></div>':'<div class="empty">No tests added. Create your test catalogue first.</div>'}
function testPage(){main.innerHTML=head('Test catalogue','Manage test names, categories and prices','<button onclick="editTest()">＋ Add test</button>')+'<section class="panel"><input id="tq" placeholder="Search tests" oninput="document.getElementById(\'testlist\').innerHTML=testTable(db.tests.filter(t=>(t.name+t.category).toLowerCase().includes(this.value.toLowerCase())))"><div id="testlist">'+testTable(db.tests)+'</div></section>'}
function packagePage(){main.innerHTML=head('Test packages','Create grouped test offerings','<button onclick="editPackage()">＋ Add package</button>')+'<section class="panel">'+(db.packages.length?'<div class="tablewrap"><table><tr><th>Package</th><th>Tests</th><th>Price</th><th></th></tr>'+db.packages.map(p=>'<tr><td>'+esc(p.name)+'</td><td>'+p.testIds.length+'</td><td>'+cash(p.price)+'</td><td><button class="alt" onclick="editPackage(\''+p.id+'\')">Edit</button> <button class="danger" onclick="del(\'packages\',\''+p.id+'\')">Delete</button></td></tr>').join('')+'</table></div>':'<div class="empty">No packages created.</div>')+'</section>'}
function doctorPage(){main.innerHTML=head('Doctors','Referring doctor directory','<button onclick="editDoctor()">＋ Add doctor</button>')+'<section class="panel">'+(db.doctors.length?'<div class="tablewrap"><table><tr><th>Name</th><th>Clinic</th><th>Phone</th><th></th></tr>'+db.doctors.map(d=>'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.clinic)+'</td><td>'+esc(d.phone)+'</td><td><button class="alt" onclick="editDoctor(\''+d.id+'\')">Edit</button> <button class="danger" onclick="del(\'doctors\',\''+d.id+'\')">Delete</button></td></tr>').join('')+'</table></div>':'<div class="empty">No doctors added.</div>')+'</section>'}
function reportPage(){let dt=document.getElementById('rd')?.value||today(),a=db.invoices.filter(x=>x.date===dt&&x.status!=='cancelled'),sum=k=>a.reduce((s,x)=>s+x[k],0);main.innerHTML=head('Collection reports','Daily billing, collections and outstanding dues')+'<section class="panel"><div class="toolbar">Date <input type="date" id="rd" value="'+dt+'" onchange="reportPage()"><button class="alt" onclick="csv()">Export CSV</button></div><div class="stats"><div class="stat"><small>Invoices</small><strong>'+a.length+'</strong></div><div class="stat"><small>Billed</small><strong>'+cash(sum('total'))+'</strong></div><div class="stat"><small>Collected</small><strong>'+cash(sum('paid'))+'</strong></div><div class="stat"><small>Outstanding</small><strong>'+cash(sum('due'))+'</strong></div></div>'+tableBills(a)+'</section>'}
function field(label,name,value,type='text',full=false){return '<div class="field '+(full?'full':'')+'"><label>'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'">'+esc(value)+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'">')+'</div>'}
function settingsPage(){let p=db.profile;main.innerHTML=head('Settings & backup','Customize all laboratory and invoice identity details')+'<section class="panel"><h3>Laboratory profile</h3><form id="pf" class="form">'+field('Header title','brandTitle',p.brandTitle||'YOUR PATHOLOGY LAB')+field('Header subtitle','brandSubtitle',p.brandSubtitle||'Local laboratory billing & management')+field('Laboratory name','name',p.name)+field('Logo image URL (optional)','logoUrl',p.logoUrl||'')+field('Subtitle / type','subtitle',p.subtitle)+field('Full address','address',p.address,'textarea',true)+field('Phone','phone',p.phone)+field('WhatsApp','whatsapp',p.whatsapp)+field('Email','email',p.email)+field('Registration / license','registration',p.registration)+field('Invoice title','invoiceTitle',p.invoiceTitle)+field('Invoice prefix','prefix',p.prefix)+field('Next invoice number','next',p.next,'number')+field('Currency symbol','currency',p.currency)+field('Footer message','footer',p.footer,'textarea',true)+field('Authorized signatory','signatory',p.signatory)+'<div class="full"><button>Save settings</button></div></form></section><section class="panel"><h3>Backup & restore</h3><p class="muted">Export all settings, patients, doctors, tests, packages and invoices to a JSON backup.</p><div class="actions"><button onclick="backup()">Download backup</button><button class="alt" onclick="document.getElementById(\'restore\').click()">Restore backup</button><input id="restore" type="file" accept=".json,application/json" hidden onchange="restore(event)"><button class="danger" onclick="clearData()">Clear all data</button></div></section><section class="panel"><h3>Storage and privacy</h3><p>Browser localStorage only. No server, database, account, cloud sync or external API. This app is single-device and single-browser.</p><p class="muted">Protect the device and export backups frequently. Do not use browser storage as the sole copy of legally or clinically important records.</p></section>';document.getElementById('pf').onsubmit=e=>{e.preventDefault();new FormData(e.target).forEach((v,k)=>p[k]=k==='next'?Math.max(1,Number(v)):v);save();applyBrand();render();alert('Settings saved')}}
function modal(title,html){document.getElementById('mtitle').textContent=title;document.getElementById('mbody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeM(){document.getElementById('modal').classList.add('hidden')}
function editTest(tid){let t=db.tests.find(x=>x.id===tid)||{name:'',category:'',price:0};modal(tid?'Edit test':'Add test','<form id="ef" class="form">'+field('Test name','name',t.name)+field('Category','category',t.category)+field('Price','price',t.price,'number')+'<div class="full"><button>Save test</button></div></form>');document.getElementById('ef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:tid||id(),name:f.get('name').trim(),category:f.get('category').trim(),price:Number(f.get('price'))};if(!v.name)return alert('Enter test name');if(tid)Object.assign(t,v);else db.tests.push(v);save();closeM();render()}}
function editPackage(pid){let p=db.packages.find(x=>x.id===pid)||{name:'',price:0,testIds:[]};modal('Test package','<form id="ef" class="form">'+field('Package name','name',p.name)+field('Package price','price',p.price,'number')+'<div class="field full"><label>Included tests</label>'+db.tests.map(t=>'<label><input type="checkbox" name="tests" value="'+t.id+'" '+(p.testIds.includes(t.id)?'checked':'')+'> '+esc(t.name)+'</label>').join('')+'</div><div class="full"><button>Save package</button></div></form>');document.getElementById('ef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:pid||id(),name:f.get('name'),price:Number(f.get('price')),testIds:f.getAll('tests')};if(pid)Object.assign(p,v);else db.packages.push(v);save();closeM();render()}}
function editDoctor(did){let d=db.doctors.find(x=>x.id===did)||{name:'',clinic:'',phone:''};modal('Doctor details','<form id="ef" class="form">'+field('Doctor name','name',d.name)+field('Clinic / hospital','clinic',d.clinic)+field('Phone','phone',d.phone)+'<div class="full"><button>Save doctor</button></div></form>');document.getElementById('ef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:did||id(),name:f.get('name'),clinic:f.get('clinic'),phone:f.get('phone')};if(did)Object.assign(d,v);else db.doctors.push(v);save();closeM();render()}}
function editPatient(pid){let p=db.patients.find(x=>x.id===pid)||{name:'',age:'',gender:'Male',phone:'',address:''};modal('Patient details','<form id="ef" class="form">'+field('Patient name','name',p.name)+field('Age','age',p.age)+ '<div class="field"><label>Gender</label><select name="gender">'+['Male','Female','Other'].map(g=>'<option '+(p.gender===g?'selected':'')+'>'+g+'</option>').join('')+'</select></div>'+field('Phone','phone',p.phone)+field('Address','address',p.address,'textarea',true)+'<div class="full"><button>Save patient</button></div></form>');document.getElementById('ef').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:pid||id(),name:f.get('name'),age:f.get('age'),gender:f.get('gender'),phone:f.get('phone'),address:f.get('address')};if(pid)Object.assign(p,v);else db.patients.push(v);save();closeM();render()}}
function del(arr,i){if(confirm('Delete this record?')){db[arr]=db[arr].filter(x=>x.id!==i);save();render()}}
function newBill(){lines=[];billForm()}
function billForm(old){let x=old||{};lines=(x.items||[]).map(a=>({...a}));let testOpts=()=>db.tests.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' · '+cash(t.price)+'</option>').join('');modal(old?'Edit invoice':'New invoice','<form id="bf"><div class="form">'+field('Patient name','patient',x.patient||'')+field('Age','age',x.age||'')+'<div class="field"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>'+field('Mobile','phone',x.phone||'')+field('Date','date',x.date||today(),'date')+'<div class="field"><label>Referring doctor</label><select name="doctor"><option value="">Select doctor</option>'+db.doctors.map(d=>'<option>'+esc(d.name)+'</option>').join('')+'</select></div>'+field('Address','address',x.address||'','text',true)+'</div><hr><div class="actions"><b>Tests / services</b><button type="button" class="alt" onclick="addLine()">＋ Add test</button><button type="button" class="alt" onclick="addPackageLines()">Add package</button></div><div class="line line-head"><b>Test / service</b><b>Price (₹)</b><b>Qty</b><span></span></div><div class="lines" id="billlines"></div><div class="form" style="margin-top:12px">'+field('Discount','discount',x.discount||0,'number')+field('Other charges','charges',x.charges||0,'number')+'<div class="field"><label>Payment method</label><select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div>'+field('Amount received','paid',x.paid??0,'number')+'</div><div class="notice" id="calc"></div><button>Save invoice</button> <button type="button" class="alt" onclick="closeM()">Cancel</button></form>');let f=document.getElementById('bf');if(x.gender)f.gender.value=x.gender;if(x.method)f.method.value=x.method;if(x.doctor)f.doctor.value=x.doctor;if(!lines.length)addLine();else drawLines();f.oninput=calc;f.onsubmit=e=>{e.preventDefault();let fd=new FormData(f),items=lines.filter(a=>a.name),subtotal=items.reduce((s,a)=>s+a.qty*a.price,0),discount=+fd.get('discount'),charges=+fd.get('charges'),total=Math.max(0,subtotal-discount+charges),paid=Math.min(total,Math.max(0,+fd.get('paid'))),name=fd.get('patient').trim();if(!name||!items.length)return alert('Enter patient name and at least one test');let pat=db.patients.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.phone===fd.get('phone'));if(!pat){pat={id:id(),name,age:fd.get('age'),gender:fd.get('gender'),phone:fd.get('phone'),address:fd.get('address')};db.patients.push(pat)}else Object.assign(pat,{age:fd.get('age'),gender:fd.get('gender'),address:fd.get('address')});let inv={id:x.id||id(),no:x.no||nextInvoiceNo(),date:fd.get('date'),patientId:pat.id,patient:name,age:fd.get('age'),gender:fd.get('gender'),phone:fd.get('phone'),address:fd.get('address'),doctor:fd.get('doctor'),items,subtotal,discount,charges,total,paid,due:total-paid,method:fd.get('method')};if(old){let oi=db.invoices.findIndex(a=>a.id===x.id);if(oi<0)return alert('Invoice not found.');inv.payments=db.invoices[oi].payments||[];inv.status=db.invoices[oi].status||'active';db.invoices[oi]=inv}else{inv.payments=[];if(paid>0)inv.payments.push({date:inv.date,amount:paid,method:inv.method,note:'Initial payment'});inv.status='active';db.invoices.push(inv)};save();closeM();go('invoices');viewBill(inv.id)}}
function addLine(){lines.push({testId:'',name:'',qty:1,price:0});drawLines()}function drawLines(){document.getElementById('billlines').innerHTML=lines.map((l,i)=>'<div class="line"><input type="text" aria-label="Test name" placeholder="Enter test / service" value="'+esc(l.name||'')+'" oninput="lineSet('+i+',\'name\',this.value)"><input type="number" aria-label="Test price" min="0" step=".01" placeholder="Price" value="'+Number(l.price||0)+'" oninput="lineSet('+i+',\'price\',this.value)"><input type="number" aria-label="Quantity" min="1" step="1" value="'+Number(l.qty||1)+'" oninput="lineSet('+i+',\'qty\',this.value)"><button type="button" class="danger" aria-label="Remove test" onclick="lines.splice('+i+',1);drawLines()">×</button></div>').join('');calc()}function lineSet(i,k,v){lines[i][k]=k==='name'?v:Number(v);calc()}function addPackageLines(){if(!db.packages.length)return alert('Create a package first');let html=db.packages.map(p=>'<button type="button" class="alt" onclick="choosePackage(\''+p.id+'\')">'+esc(p.name)+' · '+cash(p.price)+'</button>').join(' ');modal('Select package',html)}function choosePackage(pid){let p=db.packages.find(x=>x.id===pid);p.testIds.forEach(tid=>{let t=db.tests.find(x=>x.id===tid);if(t)lines.push({testId:t.id,name:t.name,qty:1,price:t.price})});closeM();billFormRefresh()}function billFormRefresh(){drawLines()}function calc(){let f=document.getElementById('bf');if(!f)return;let sub=lines.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0),total=Math.max(0,sub-(+f.discount.value||0)+(+f.charges.value||0));document.getElementById('calc').innerHTML='Subtotal '+cash(sub)+' · Total <b>'+cash(total)+'</b> · Due '+cash(Math.max(0,total-(+f.paid.value||0)))}
function invoiceHTML(x){let p=db.profile;return '<div class="labtitle">'+esc(p.name)+'</div><div class="sub">'+esc(p.subtitle)+'</div><div class="sub">'+esc(p.address)+' · '+esc(p.phone)+' · '+esc(p.email)+'</div><div class="sub">'+esc(p.registration)+'</div><hr><div style="display:flex;justify-content:space-between"><b>'+esc(p.invoiceTitle)+'</b><b>'+esc(x.no)+'</b></div><p>Date: '+esc(x.date)+'<br>Patient: <b>'+esc(x.patient)+'</b> · Age/Gender: '+esc(x.age)+' / '+esc(x.gender)+'<br>Mobile: '+esc(x.phone)+'<br>Address: '+esc(x.address)+'<br>Referring doctor: '+esc(x.doctor)+'</p><table><tr><th>#</th><th>Test</th><th>Qty</th><th class="right">Rate</th><th class="right">Amount</th></tr>'+x.items.map((a,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(a.name)+'</td><td>'+a.qty+'</td><td class="right">'+cash(a.price)+'</td><td class="right">'+cash(a.qty*a.price)+'</td></tr>').join('')+'</table><div class="totals"><div><span>Subtotal</span><b>'+cash(x.subtotal)+'</b></div><div><span>Discount</span><b>'+cash(x.discount)+'</b></div><div><span>Other charges</span><b>'+cash(x.charges)+'</b></div><div class="grand"><span>Total</span><span>'+cash(x.total)+'</span></div><div><span>Paid ('+esc(x.method)+')</span><b>'+cash(x.paid)+'</b></div><div><span>Balance due</span><b>'+cash(x.due)+'</b></div></div><p style="text-align:center;margin-top:24px">'+esc(p.footer)+'</p><div style="display:flex;justify-content:space-between;margin-top:35px"><span>Patient signature</span><span>'+esc(p.signatory)+'</span></div><div style="text-align:center;margin-top:14px"><svg id="barcode" data-code="'+esc(x.no)+'"></svg><div style="font-size:10px">'+esc(x.no)+'</div></div>'}
function viewBill(iid){let x=db.invoices.find(a=>a.id===iid);modal('Invoice '+x.no,'<div class="actions no-print"><button onclick="printBill(\''+iid+'\')">Print / Save PDF</button><button class="alt" onclick="thermal(\''+iid+'\')">Thermal receipt</button><button class="alt" onclick="editBill(\''+iid+'\')">Edit</button><button class="alt" onclick="payment(\''+iid+'\')">Record payment</button><button class="alt" onclick="downloadOne(\''+iid+'\')">Download JSON</button></div><div class="invoice">'+invoiceHTML(x)+'</div>');barcode(document.querySelector('#mbody svg'),x.no)}
function barcode(svg,value){if(!svg)return;let map={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','A':'wnnnnwnnw','B':'nnwnnwnnw','C':'wnwnnwnnn','D':'nnnnwwnnw','E':'wnnnwwnnn','F':'nnwnwwnnn','G':'nnnnnwwnw','H':'wnnnnwwnn','I':'nnwnnwwnn','J':'nnnnwwwnn','K':'wnnnnnnww','L':'nnwnnnnww','M':'wnwnnnnwn','N':'nnnnwnnww','O':'wnnnwnnwn','P':'nnwnwnnwn','Q':'nnnnnnwww','R':'wnnnnnwwn','S':'nnwnnnwwn','T':'nnnnwnwwn','U':'wwnnnnnnw','V':'nwwnnnnnw','W':'wwwnnnnnn','X':'nwnnwnnnw','Y':'wwnnwnnnn','Z':'nwwnwnnnn','-':'nwnnnnwnw','.':'wwnnnnwnn',' ':'nwwnnnwnn','$':'nwnwnwnnn','/':'nwnwnnnwn','+':'nwnnnwnwn','%':'nnnwnwnwn','*':'nwnnwnwnn'};let s='*'+String(value).toUpperCase().replace(/[^0-9A-Z. $/+%-]/g,'')+'*',x=5,w=2;let html='';for(let c of s){for(let i=0;i<9;i++){let z=map[c]?.[i]==='w'?5:2;if(i%2===0)html+='<rect x="'+x+'" y="0" width="'+z+'" height="38"/>';x+=z}x+=2}svg.setAttribute('viewBox','0 0 '+(x+5)+' 40');svg.setAttribute('width','250');svg.setAttribute('height','40');svg.innerHTML='<g fill="#111">'+html+'</g>'}
function printBill(iid){let x=db.invoices.find(a=>a.id===iid),w=window.open('','_blank');w.document.write('<html><head><title>'+esc(x.no)+'</title><style>body{font:13px Arial;color:#172b36}.invoice{max-width:800px;margin:auto;padding:20px}.labtitle{text-align:center;font-size:22px;font-weight:bold}.sub{text-align:center;color:#555;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.right{text-align:right}.totals{width:300px;margin-left:auto}.totals div{display:flex;justify-content:space-between;padding:5px}.grand{border-top:1px solid;font-weight:bold}@page{margin:12mm}</style></head><body><div class="invoice">'+invoiceHTML(x)+'</div></body></html>');w.document.close();w.onload=()=>{barcode(w.document.querySelector('svg'),x.no);w.print()}}
function thermal(iid){let x=db.invoices.find(a=>a.id===iid),w=window.open('','_blank');w.document.write('<html><head><style>body{font:12px monospace;width:72mm;margin:4mm}h3,p{text-align:center}table{width:100%}td{padding:4px 0;border-bottom:1px dashed #aaa}.r{text-align:right}@page{size:80mm auto;margin:3mm}</style></head><body><h3>'+esc(db.profile.name)+'</h3><p>'+esc(db.profile.address)+'<br>'+esc(db.profile.phone)+'</p><hr>'+esc(x.no)+'<br>'+esc(x.date)+'<br>'+esc(x.patient)+'<hr><table>'+x.items.map(a=>'<tr><td>'+esc(a.name)+' x'+a.qty+'</td><td class="r">'+cash(a.qty*a.price)+'</td></tr>').join('')+'</table><hr><p>Subtotal '+cash(x.subtotal)+'<br>Discount '+cash(x.discount)+'<br><b>Total '+cash(x.total)+'</b><br>Paid '+cash(x.paid)+'<br>Due '+cash(x.due)+'</p><p>'+esc(db.profile.footer)+'</p></body></html>');w.document.close();w.onload=()=>w.print()}
function editBill(iid){let x=db.invoices.find(a=>a.id===iid);closeM();billForm(x)}function payment(iid){let x=db.invoices.find(a=>a.id===iid);modal('Record payment','<p>Outstanding: <b>'+cash(x.due)+'</b></p><form id="pay"><div class="form">'+field('Amount received','amount','','number')+'<div class="field"><label>Method</label><select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select></div><div class="full"><button>Save payment</button></div></div></form>');document.getElementById('pay').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n=Number(f.get('amount'));if(n<=0||n>x.due)return alert('Enter valid amount');x.paid+=n;x.due=x.total-x.paid;x.method=f.get('method');save();closeM();viewBill(iid)}}
function history(pid){let p=db.patients.find(a=>a.id===pid);modal('Patient history','<h3>'+esc(p.name)+'</h3><p>'+esc(p.age)+' / '+esc(p.gender)+' · '+esc(p.phone)+'</p>'+tableBills(db.invoices.filter(x=>x.patientId===pid)))}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='pathology-lab-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.profile||!Array.isArray(d.invoices)||!Array.isArray(d.tests))throw 0;if(confirm('Replace current local data with this backup?')){db=Object.assign(structuredClone(blank),d);save();render();alert('Backup restored')}}catch{alert('Invalid backup file')}e.target.value=''};r.readAsText(f)}function clearData(){if(confirm('Delete all local data? Export a backup first.')){localStorage.removeItem(KEY);db=structuredClone(blank);render()}}function downloadOne(iid){let x=db.invoices.find(a=>a.id===iid),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=x.no+'.json';a.click()}function csv(){let rows=[['Invoice','Date','Patient','Phone','Total','Paid','Due','Method'],...db.invoices.map(x=>[x.no,x.date,x.patient,x.phone,x.total,x.paid,x.due,x.method])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='pathology-invoices.csv';a.click()}

<script>
(function(){
window.nextInvoiceNo=function(){var p=(db.profile.prefix||'INV').trim(),used=new Set(db.invoices.map(x=>x.no)),n=Math.max(1,Number(db.profile.next)||1),v;do{v=p+'-'+String(n++).padStart(4,'0')}while(used.has(v));db.profile.next=n;return v};
db.invoices.forEach(function(x){if(!Array.isArray(x.payments)){x.payments=[];if(Number(x.paid)>0)x.payments.push({date:x.date||today(),amount:Number(x.paid),method:x.method||'Existing payment',note:'Opening payment'});}if(!x.status)x.status='active';});
window.choosePackage=function(pid){var p=db.packages.find(x=>x.id===pid);if(!p)return;lines.push({name:p.name+' Package',qty:1,price:Number(p.price)||0});closeM();drawLines()};
window.payment=function(iid){var x=db.invoices.find(a=>a.id===iid);if(!x||x.status==='cancelled')return alert('Cannot add payments to a cancelled invoice.');var rows=(x.payments||[]).slice().reverse().map(function(p){return '<div class="payment-row"><span>'+esc(p.date)+' · '+esc(p.method)+'<br><small>'+esc(p.note||'Payment')+'</small></span><b>'+cash(p.amount)+'</b></div>'}).join('')||'<p class="muted">No payment history.</p>';modal('Payment history — '+x.no,'<p>Total: <b>'+cash(x.total)+'</b> · Received: <b>'+cash(x.paid)+'</b> · Due: <b>'+cash(x.due)+'</b></p><div class="payment-log">'+rows+'</div><hr><form id="pay"><div class="form">'+field('Amount received','amount','','number')+'<div class="field"><label>Payment method</label><select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Other</option></select></div>'+field('Payment date','date',today(),'date')+field('Reference / note','note','','text')+'<div class="full"><button>Save payment</button></div></div></form>');document.getElementById('pay').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),n=Number(f.get('amount'));if(!(n>0)||n>x.due)return alert('Enter a valid amount within the outstanding balance.');x.payments=x.payments||[];x.payments.push({date:f.get('date'),amount:n,method:f.get('method'),note:f.get('note')});x.paid=x.payments.reduce(function(s,p){return s+Number(p.amount||0)},0);x.due=Math.max(0,x.total-x.paid);x.method=f.get('method');save();closeM();viewBill(iid)}};
window.cancelInvoice=function(iid){var x=db.invoices.find(a=>a.id===iid);if(!x||x.status==='cancelled')return;var reason=prompt('Reason for cancelling this invoice:');if(!reason||!reason.trim())return;x.status='cancelled';x.cancelReason=reason.trim();x.cancelledAt=new Date().toISOString();save();closeM();render()};
var originalViewBill=window.viewBill;
window.viewBill=function(iid){originalViewBill(iid);var x=db.invoices.find(a=>a.id===iid);if(!x)return;var actions=document.querySelector('#mbody .actions');if(actions&&x.status!=='cancelled'){var b=document.createElement('button');b.className='danger';b.textContent='Cancel invoice';b.onclick=function(){cancelInvoice(iid)};actions.appendChild(b)}};
var originalInvoiceHTML=window.invoiceHTML;
window.invoiceHTML=function(x){var html=originalInvoiceHTML(x);if(x.status==='cancelled')html+='<p style="color:#a12626;font-weight:bold">CANCELLED — '+esc(x.cancelReason||'')+'</p>';return html};
window.editBill=function(iid){var x=db.invoices.find(a=>a.id===iid);if(!x)return;if(x.status==='cancelled')return alert('Cancelled invoices cannot be edited.');closeM();billForm(x)};
window.invoiceHTML=function(x){var p=db.profile,logo=p.logoUrl?'<img src="'+esc(p.logoUrl)+'" alt="Laboratory logo" style="width:64px;height:64px;object-fit:contain">':'';return '<div style="display:flex;align-items:center;gap:14px"><div>'+logo+'</div><div style="flex:1;text-align:center"><div class="labtitle">'+esc(p.name)+'</div><div class="sub">'+esc(p.subtitle)+'</div><div style="font-size:11px;color:#667985">'+esc(p.address)+' · '+esc(p.phone)+' · '+esc(p.email)+'<br>'+esc(p.registration)+'</div></div></div><hr><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>'+esc(p.invoiceTitle)+'</b><b>Invoice: '+esc(x.no)+'</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0"><div style="border:1px solid #dce5e9;border-radius:7px;padding:10px"><small> PATIENT </small><br><b>'+esc(x.patient)+'</b><br>Age / Gender: '+esc(x.age)+' / '+esc(x.gender)+'<br>Mobile: '+esc(x.phone)+'<br>'+esc(x.address)+'</div><div style="border:1px solid #dce5e9;border-radius:7px;padding:10px"><small> INVOICE DETAILS </small><br>Date: '+esc(x.date)+'<br>Referring doctor: '+esc(x.doctor||'—')+'<br>Status: '+(x.status==='cancelled'?'CANCELLED':x.due>0?'PENDING':'PAID')+'<br>Payment method: '+esc(x.method||'—')+'</div></div><table style="width:100%;border-collapse:collapse"><tr><th style="background:#eef3f5;padding:9px;text-align:left">#</th><th style="background:#eef3f5;padding:9px;text-align:left">Description</th><th style="background:#eef3f5;padding:9px">Qty</th><th style="background:#eef3f5;padding:9px;text-align:right">Rate</th><th style="background:#eef3f5;padding:9px;text-align:right">Amount</th></tr>'+x.items.map(function(a,i){return '<tr><td style="padding:9px;border-bottom:1px solid #e5eaed">'+(i+1)+'</td><td style="padding:9px;border-bottom:1px solid #e5eaed">'+esc(a.name)+'</td><td style="padding:9px;border-bottom:1px solid #e5eaed;text-align:center">'+a.qty+'</td><td style="padding:9px;border-bottom:1px solid #e5eaed;tex
